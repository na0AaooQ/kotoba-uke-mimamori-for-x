<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        box-sizing: border-box;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: #fff7ed;
        color: #3f3f46;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.7;
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      .options-container {
        width: min(100%, 720px);
        margin: 0 auto;
      }

      .options-card {
        padding: 24px;
        border: 1px solid rgba(245, 158, 11, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 24px rgba(120, 53, 15, 0.08);
      }

      .options-title {
        margin: 0 0 8px;
        color: #7c4a03;
        font-size: 24px;
        line-height: 1.4;
      }

      .options-description {
        margin: 0 0 20px;
        color: #57534e;
      }

      .options-setting-row {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px 0;
        color: #3f3f46;
        font-weight: 600;
      }

      .options-checkbox {
        width: 20px;
        height: 20px;
        margin: 0;
        accent-color: #d97706;
      }

      .options-checkbox:focus-visible {
        outline: 2px solid rgba(245, 158, 11, 0.86);
        outline-offset: 3px;
      }

      .options-sensitivity {
        display: grid;
        gap: 10px;
        margin: 8px 0 20px;
        padding: 16px 0 0;
        border: 0;
        border-top: 1px solid rgba(245, 158, 11, 0.2);
      }

      .options-sensitivity-title {
        margin: 0;
        padding: 0 8px 0 0;
        color: #7c4a03;
        font-weight: 700;
      }

      .options-radio-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(255, 247, 237, 0.55);
        color: #3f3f46;
      }

      .options-radio {
        width: 20px;
        height: 20px;
        margin: 3px 0 0;
        accent-color: #d97706;
      }

      .options-radio:focus-visible {
        outline: 2px solid rgba(245, 158, 11, 0.86);
        outline-offset: 3px;
      }

      .options-radio-copy {
        display: grid;
      }

      .options-radio-label {
        font-weight: 600;
      }

      .options-radio-description {
        color: #57534e;
        font-size: 14px;
        font-weight: 400;
      }

      .options-note {
        margin: 16px 0 0;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgba(255, 247, 237, 0.9);
        color: #57534e;
      }

      .options-note p {
        margin: 0;
      }

      .options-note p + p {
        margin-top: 4px;
      }

      .options-status {
        min-height: 1.7em;
        margin: 12px 0 0;
        color: #7c4a03;
        font-size: 14px;
      }

      .options-status[data-state="error"] {
        color: #9f1239;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #18130f;
          color: #f8efd7;
        }

        .options-card {
          border-color: rgba(251, 191, 36, 0.32);
          background: rgba(43, 35, 27, 0.96);
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .options-title,
        .options-status,
        .options-sensitivity-title {
          color: #fde68a;
        }

        .options-description,
        .options-setting-row,
        .options-note,
        .options-radio-row,
        .options-radio-description {
          color: #f8efd7;
        }

        .options-note,
        .options-radio-row {
          background: rgba(67, 56, 38, 0.72);
        }

        .options-status[data-state="error"] {
          color: #fecdd3;
        }
      }
    </style>
  </head>
  <body>
    <main class="options-container">
      <section class="options-card" aria-labelledby="options-title">
        <h1 id="options-title" class="options-title" data-i18n="optionsTitle"></h1>
        <p class="options-description" data-i18n="optionsDescription"></p>

        <label class="options-setting-row">
          <input id="option-enabled" class="options-checkbox" type="checkbox" />
          <span data-i18n="optionEnableExtension"></span>
        </label>

        <fieldset class="options-sensitivity">
          <legend class="options-sensitivity-title" data-i18n="optionCushionSensitivity"></legend>

          <label class="options-radio-row">
            <input
              id="option-cushion-sensitivity-low"
              class="options-radio"
              type="radio"
              name="option-cushion-sensitivity"
              value="low"
            />
            <span class="options-radio-copy">
              <span class="options-radio-label" data-i18n="optionSensitivityLow"></span>
              <span
                class="options-radio-description"
                data-i18n="optionSensitivityLowDescription"
              ></span>
            </span>
          </label>

          <label class="options-radio-row">
            <input
              id="option-cushion-sensitivity-standard"
              class="options-radio"
              type="radio"
              name="option-cushion-sensitivity"
              value="standard"
            />
            <span class="options-radio-copy">
              <span class="options-radio-label" data-i18n="optionSensitivityStandard"></span>
              <span
                class="options-radio-description"
                data-i18n="optionSensitivityStandardDescription"
              ></span>
            </span>
          </label>

          <label class="options-radio-row">
            <input
              id="option-cushion-sensitivity-high"
              class="options-radio"
              type="radio"
              name="option-cushion-sensitivity"
              value="high"
            />
            <span class="options-radio-copy">
              <span class="options-radio-label" data-i18n="optionSensitivityHigh"></span>
              <span
                class="options-radio-description"
                data-i18n="optionSensitivityHighDescription"
              ></span>
            </span>
          </label>
        </fieldset>

        <div class="options-note">
          <p data-i18n="optionPrivacyNote"></p>
          <p data-i18n="optionStorageNote"></p>
          <p data-i18n="optionReloadNote"></p>
        </div>

        <p id="options-status" class="options-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
